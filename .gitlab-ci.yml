stages:
  - benchmark

variables:
  BENCHMARK_RUNS_DIR: /srv/automatic-llm-benchmark/runs
  GITLAB_INTERNAL_API_URL: "http://172.20.1.52:81/api/v4"

phase1_benchmark:
  stage: benchmark
  resource_group: phase1-benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - when: never
  script:
    - |
      set -eu

      : "${PROJECT1_HANDOFF_B64:?PROJECT1_HANDOFF_B64 is required}"
      : "${PROJECT1_UPSTREAM_PROJECT_ID:?PROJECT1_UPSTREAM_PROJECT_ID is required}"
      : "${PROJECT1_UPSTREAM_JOB_ID:?PROJECT1_UPSTREAM_JOB_ID is required}"
      : "${PROJECT1_BENCHMARK_FILE:?PROJECT1_BENCHMARK_FILE is required}"
      : "${PROJECT1_ARTIFACT_READ_TOKEN:?PROJECT1_ARTIFACT_READ_TOKEN is required}"
      : "${PROJECT1_LITELLM_API_KEY:?PROJECT1_LITELLM_API_KEY is required}"
      : "${LITELLM_API_KEY:?LITELLM_API_KEY is required}"

      if ! printf '%s' "$PROJECT1_UPSTREAM_PROJECT_ID" | grep -Eq '^[0-9]*[1-9][0-9]*$'; then
        echo "PROJECT1_UPSTREAM_PROJECT_ID must be a positive numeric ID" >&2
        exit 65
      fi
      if ! printf '%s' "$PROJECT1_UPSTREAM_JOB_ID" | grep -Eq '^[0-9]*[1-9][0-9]*$'; then
        echo "PROJECT1_UPSTREAM_JOB_ID must be a positive numeric ID" >&2
        exit 65
      fi
      case "$PROJECT1_BENCHMARK_FILE" in
        benchmark.json|benchmark.jsonl|benchmark.csv|benchmark.parquet) ;;
        *) echo "Unsupported benchmark filename: $PROJECT1_BENCHMARK_FILE" >&2; exit 65 ;;
      esac
      if ! command -v curl >/dev/null 2>&1; then
        echo "curl is required to download the benchmark dataset" >&2
        exit 69
      fi

      dataset_dir="$CI_PROJECT_DIR/ci_artifacts/input"
      dataset_path="$dataset_dir/$PROJECT1_BENCHMARK_FILE"
      handoff_file=
      benchmark_log=
      cleanup() {
        rm -f -- "$handoff_file" "$benchmark_log"
        rm -rf -- "$dataset_dir"
      }
      trap cleanup EXIT HUP INT TERM
      rm -rf -- "$dataset_dir"
      install -d -m 700 "$dataset_dir"

      artifact_url="$GITLAB_INTERNAL_API_URL/projects/$PROJECT1_UPSTREAM_PROJECT_ID/jobs/$PROJECT1_UPSTREAM_JOB_ID/artifacts/ci_artifacts/job/$PROJECT1_BENCHMARK_FILE"
      if ! curl --fail --silent --show-error --location \
        --header "PRIVATE-TOKEN: $PROJECT1_ARTIFACT_READ_TOKEN" \
        --output "$dataset_path" "$artifact_url"; then
        echo "Failed to download benchmark dataset from upstream job" >&2
        exit 69
      fi
      if [ ! -f "$dataset_path" ] || [ ! -s "$dataset_path" ]; then
        echo "Downloaded benchmark dataset is missing or empty" >&2
        exit 66
      fi

      BENCHMARK_DATASETS_DIR="$dataset_dir"
      BENCHMARK_DATASET_PATH="/datasets/$PROJECT1_BENCHMARK_FILE"
      export BENCHMARK_DATASETS_DIR BENCHMARK_DATASET_PATH

      handoff_file=$(mktemp "${TMPDIR:-/tmp}/project1-gateway-manifest.XXXXXX.json")
      benchmark_log=$(mktemp "${TMPDIR:-/tmp}/phase1-benchmark.XXXXXX.log")
      chmod 600 "$handoff_file"

      if ! printf '%s' "$PROJECT1_HANDOFF_B64" | base64 --decode >"$handoff_file"; then
        echo "PROJECT1_HANDOFF_B64 is not valid Base64" >&2
        exit 65
      fi

      set -o pipefail

      if sh scripts/run_benchmark.sh configs/ci_phase1.yaml \
        --project1-handoff "$handoff_file" 2>&1 | tee "$benchmark_log"; then
        :
      else
        benchmark_status=$?
        exit "$benchmark_status"
      fi

      run_ids=$(sed -n 's#^Run initialized: /workspace/runs/\([A-Za-z0-9][A-Za-z0-9._-]*\)$#\1#p' "$benchmark_log")
      run_count=$(printf '%s\n' "$run_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')
      if [ "$run_count" != "1" ]; then
        echo "Expected exactly one run initialized by this job; found $run_count" >&2
        exit 70
      fi
      run_id=$run_ids
      run_dir="$BENCHMARK_RUNS_DIR/$run_id"
      if [ ! -d "$run_dir" ]; then
        echo "Created benchmark run directory was not found: $run_dir" >&2
        exit 70
      fi

      artifact_dir="$CI_PROJECT_DIR/ci_artifacts/benchmark"
      install -d "$artifact_dir"
      for artifact in \
        reports/report.md \
        reports/report.json \
        reports/samples.csv \
        metadata/artifact_validation.json \
        metadata/reproducibility.json \
        manifest.json
      do
        if [ ! -r "$run_dir/$artifact" ]; then
          echo "Required benchmark artifact is missing: $artifact" >&2
          exit 70
        fi
        cp "$run_dir/$artifact" "$artifact_dir/$(basename "$artifact")"
      done
  artifacts:
    name: "phase1-benchmark-$CI_PIPELINE_ID"
    paths:
      - ci_artifacts/benchmark/report.md
      - ci_artifacts/benchmark/report.json
      - ci_artifacts/benchmark/samples.csv
      - ci_artifacts/benchmark/artifact_validation.json
      - ci_artifacts/benchmark/reproducibility.json
      - ci_artifacts/benchmark/manifest.json
    expire_in: 30 days
